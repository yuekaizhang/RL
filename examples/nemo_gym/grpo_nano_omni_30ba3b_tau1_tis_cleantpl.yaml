# TIS recipe x FULL public HF data x clean chat-template rendering.
#
# Single-variable counterpart of the original TIS arm (tau1-nano-tis-4n8g):
# identical data (public 96K, unfiltered), identical loss/optimizer/schedule;
# the only training-dynamics change is the sysfix chat template (plain-text
# system rendering). keep_top_k 7 differs but only affects disk retention.
# Comparing step-for-step against tis_410 isolates the rendering effect on
# TRAINING (the base-model eval control already showed rendering does not
# move eval scores by itself).
#
# Checkpoints from this arm must be EVALUATED with the same clean template.

