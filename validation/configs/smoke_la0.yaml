defaults: ../../examples/configs/recipes/llm/grpo-qwen2.5-1.5b-1n2g-automodel-single-controller-full-batch.yaml
grpo:
  seed: 42
  max_num_steps: 5
  val_at_start: false
  val_at_end: false
policy:
  model_name: /lustre/fs1/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/shuangy/models/Qwen/Qwen2.5-1.5B
  tokenizer:
    name: ${policy.model_name}
  generation:
    vllm_cfg:
      gpu_memory_utilization: 0.6
loss_fn:
  use_importance_sampling_correction: true
  force_on_policy_ratio: false
async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 0
  min_groups_for_streaming_train: 2
  max_inflight_prompts: 2
  max_buffered_rollouts: 2
checkpointing:
  enabled: true
  checkpoint_dir: /lustre/fsw/portfolios/coreai/users/yuekaiz/single_controller/RL-pr4963/validation/results/yuekaiz-qwen25-1p5b-fullbatch-la0-smoke-pr4963/checkpoints
  save_period: 2
  keep_top_k: 2
  save_optimizer: true
  save_data_plane: true
  checkpoint_must_save_by: null
logger:
  log_dir: /lustre/fsw/portfolios/coreai/users/yuekaiz/single_controller/RL-pr4963/validation/results/yuekaiz-qwen25-1p5b-fullbatch-la0-smoke-pr4963/logs
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    id: yuekaiz4963smokela0
    name: yuekaiz-qwen25-1p5b-fullbatch-la0-smoke-pr4963
    group: yuekaiz-pr4963-fullbatch-lookahead1-smoke
    project: nemo-rl-automodel-sc
    entity: yuekaiz
    resume: allow
cluster:
  num_nodes: 1
  gpus_per_node: 2
data:
  train:
    dataset_name: DAPOMath17K
  default:
    prompt_file: null
env:
  math:
    num_workers: 4
    math_verify_impl: dapo_math_verify
