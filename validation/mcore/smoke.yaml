defaults: ../configs/smoke_la0.yaml
grpo:
  max_num_steps: 3
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  use_leave_one_out_baseline: false
policy:
  model_name: /lustre/fs1/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/shuangy/models/Qwen/Qwen2.5-1.5B
  tokenizer:
    name: ${policy.model_name}
  max_total_sequence_length: 1024
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: false
    apply_rope_fusion: false
    defer_fp32_logits: true
    freeze_moe_router: false
    moe_router_dtype: null
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 0.0
    model_overrides:
      moe_router_pre_softmax: false
      moe_aux_loss_coeff: 0.0
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-06
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-08
      clip_grad: 1.0
      use_precision_aware_optimizer: true
      main_grads_dtype: float32
      main_params_dtype: float32
      exp_avg_dtype: bfloat16
      exp_avg_sq_dtype: bfloat16
      store_param_remainders: true
    scheduler:
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-14
      lr_decay_style: constant
      lr_decay_iters: 300
      start_weight_decay: 0.1
      end_weight_decay: 0.1
      weight_decay_incr_style: constant
    distributed_data_parallel_config:
      grad_reduce_in_fp32: true
  generation:
    max_new_tokens: 512
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: 1024
    colocated:
      resources:
        num_nodes: 1
        gpus_per_node: 1
  automodel_cfg:
    enabled: false
  logprob_chunk_size: 4096
cluster:
  num_nodes: 1
  gpus_per_node: 2
data:
  max_input_seq_length: 512
checkpointing:
  checkpoint_dir: /lustre/fsw/portfolios/coreai/users/yuekaiz/single_controller/RL-pr4963/validation/mcore/results/yuekaiz-mcore-smoke/checkpoints
  checkpoint_must_save_by: null
  save_period: 2
logger:
  log_dir: /lustre/fsw/portfolios/coreai/users/yuekaiz/single_controller/RL-pr4963/validation/mcore/results/yuekaiz-mcore-smoke/logs
  wandb_enabled: false
async_rl:
  min_groups_for_streaming_train: 8
  max_inflight_prompts: 16
  max_buffered_rollouts: 16
  sampler:
    name: in_order
    max_lookahead_versions: 0
